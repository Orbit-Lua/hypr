name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, types, snapshots and config parse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed diffutils git make lua stylua luacheck lua-language-server hyprland
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Hyprland refuses to run as root, so check as a user owning the checkout.
      - run: |
          useradd --create-home ci
          chown -R ci "$GITHUB_WORKSPACE"
          runuser -u ci -- make check
